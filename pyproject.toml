[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creo"
version = "0.1.0"
description = "CREO: Repair-Guided Evolutionary Optimisation for constrained continuous optimization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Alan Vallavaraj" }
]
dependencies = [
  "numpy>=1.24"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python :: 3"
]

[project.urls]
Homepage = "https://github.com/alanvallavaraj/CREO-PyPl"
Repository = "https://github.com/alanvallavaraj/CREO-PyPl"
Research = "https://github.com/alanvallavaraj/CREO-Research"

[tool.setuptools.packages.find]
where = ["src"]
